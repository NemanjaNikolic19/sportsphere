<section class="login-card">
    @if(isAdminRoute()) {
        <h1>Admin login</h1>
        <p class="hint">Hidden administrator route</p>
    } @else {
        <h1>Login</h1>
        <p class="hint">Athlete and employee login</p>
    }

    @if(errorMessage) {
        <div class="error">
            {{ errorMessage }}
        </div>
    }

    <form (ngSubmit)="login()">
        <label>
            Username
            <input 
                type="text"
                name="username"
                [(ngModel)]="username"
            />
        </label>

        <label>
            Password
            <input 
                type="password"
                name="password"
                [(ngModel)]="password"
            />
        </label>

        <button type="submit" [disabled]="loading">
            {{ loading ? 'Logging in ...' : 'Login' }}
        </button>
    </form>

    @if(!isAdminRoute()) {
        <p>
            <a routerLink="/forgot-password">
                Forgot your password?
            </a>
        </p>
    }

    <p class="demo">
        Demo password for seed users: <strong>Admin#123</strong>
    </p>

    <p class="register-link">
        Don't have an account?
        <a routerLink="/register">Register here</a>
    </p>

    <a routerLink="/">Back to home</a>
</section>
